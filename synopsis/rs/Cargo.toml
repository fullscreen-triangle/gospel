[package]
name = "synopsis-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "The synopsis genomic scripting language: parser, checker, evaluator, and local server."
license = "MIT"

# Deliberately NOT a member of the repository's other workspaces.
# gospel-core and gospel-rust are a different framework with heavy
# dependencies (rust-htslib, tokio, nalgebra); synopsis shares no types
# with them and must not inherit their build.
[workspace]

[[bin]]
name = "synopsis"
path = "src/main.rs"

[lib]
name = "synopsis"
path = "src/lib.rs"

[dependencies]
# Kept minimal on purpose: this is a binary a user downloads and runs,
# so every dependency is a supply-chain question and a build-time cost.
serde = { version = "1", features = ["derive"] }
# `preserve_order` is REQUIRED, not a nicety: without it serde_json backs
# its objects with a BTreeMap and sorts keys alphabetically, which would
# emit `decls` before `node` and break tree conformance. See json.rs.
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
strip = true
